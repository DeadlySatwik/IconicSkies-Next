name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      AUTH_SECRET: ci-only-iconicskies-auth-secret
      OTP_SECRET: ci-only-iconicskies-otp-secret
      OTP_DEV_LOG_CODES: "false"
      DATABASE_URL: postgres://iconicskies:iconicskies@127.0.0.1:5432/iconicskies
      OPENWEATHER_API_KEY: ""
      GCS_PROJECT_ID: ""
      GCS_BUCKET_NAME: ""
      GCS_CLIENT_EMAIL: ""
      GCS_PRIVATE_KEY: ""
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      GROQ_API_KEY: ""
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
      EMAIL_VALIDATION_PROVIDER: disabled
      EMAIL_VALIDATION_API_KEY: ""
      EMAIL_VALIDATION_STRICT: "false"
      SMS_OTP_PROVIDER: disabled
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e -- --reporter=html

      - name: Upload Playwright report
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
