services:
  postgres:
    image: postgres:18
    container_name: iconicskies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iconicskies
      POSTGRES_USER: iconicskies
      POSTGRES_PASSWORD: iconicskies
    ports:
      - "5432:5432"
    volumes:
      - iconicskies-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iconicskies -d iconicskies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iconicskies-postgres-data:
